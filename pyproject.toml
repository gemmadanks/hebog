[project]
name = "hebog"
version = "0.4.0"
description = "Dask-aware radio-continuum source finding for SKA SDP pipelines"
authors = [
    {name = "Gemma Danks", email = "gemma.danks@skao.int"},
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1,<9",
    "dask[array,distributed]>=2026.7.1,<2027",
    "numba>=0.61,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "scipy>=1.12,<2",
    "zarr>=3.2,<3.3",
]

[project.scripts]
hebog = "hebog.cli:main"

[dependency-groups]
dev = [
    "marimo>=0.23.15",
    "pytest>=9.1.1,<10.0.0",
    "pytest-benchmark>=5.1,<6",
    "ruff>=0.16.0,<0.17.0",
    "pre-commit>=4.6.1,<5.0.0",
    "pyright>=1.1.411,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.15,<4",
    "hypothesis>=6.163.0,<7",
    "matplotlib>=3.10,<4",
]

docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material"
]


[tool.coverage.run]
branch = true
source = ["src/hebog"]
omit = [
    "tests/*",
    "conftest.py"
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "acceptance: Rapthor-facing behaviour scenarios",
    "benchmark: performance regression and scaling tests",
    "contract: scheduler-independent public behaviour and product contracts",
    "equivalence: scientific comparisons with PyBDSF reference products",
    "integration: Dask, FITS, and Rapthor integration tests",
    "qualification: held-out scientific validation for milestone and release gates",
    "requires_data: tests requiring external or non-redistributable datasets",
    "scalability: controlled large-image and multi-node scaling tests",
    "slow: tests excluded from the fast development and pull-request suites",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 79
src = ["src", "tests"]
extend-exclude = ["benchmark-results"]

[tool.ruff.lint]
select = [
    "ARG",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "RUF",
    "SIM",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["hebog"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["PLC0415", "PLR0913", "PLR0917", "PLR1711"]
"tests/**" = ["PLR2004"]

[build-system]
requires = ["uv-build>=0.12.0,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hebog"
module-root = "src"
