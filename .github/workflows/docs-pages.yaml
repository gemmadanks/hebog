name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-pages.yaml"
      - "src/hebog/**"  # rebuild if API docs change

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.16"  # UV_VERSION in ci.yaml

      - name: Install docs deps
        run: uv sync --group docs

      - name: Build & deploy with MkDocs
        # --force overwrites existing site; --clean removes stale files
        run: uv run --group docs mkdocs gh-deploy --force --clean
