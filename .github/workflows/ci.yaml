name: CI

# A pull request runs CI through its own event, so a push runs it only on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The one uv version. The other workflows, the Dockerfile, the pre-commit
  # uv-lock hook and .readthedocs.yaml name it too, and
  # tests/unit/test_uv_version.py holds them equal.
  UV_VERSION: "0.13.0"
  # Match the controlled replay budget before NumPy/BLAS or workers import.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  changes:
    name: Classify changes and freeze test timings
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.paths.outputs.full }}
    steps:
      - name: Checkout the complete diff, including deleted and renamed paths
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the change
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/ci.py changes
          --event "$EVENT" --base "$BASE_SHA" --output "$GITHUB_OUTPUT"

      - name: Restore the last completed main timing baseline
        if: steps.paths.outputs.full == 'true'
        uses: actions/cache/restore@v5
        with:
          path: test-results/durations.json
          key: ci-test-durations-v1-${{ github.sha }}
          restore-keys: ci-test-durations-v1-

      - name: Initialize an absent timing baseline
        if: steps.paths.outputs.full == 'true'
        run: |
          mkdir -p test-results
          test -f test-results/durations.json || echo '{}' > test-results/durations.json

      - name: Publish one identical timing snapshot for all shards
        if: steps.paths.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-duration-baseline
          path: test-results/durations.json
          if-no-files-found: error

  pre-commit:
    name: Pre-commit hooks (lint/format/spell/type, all files)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # The dedicated jobs below cover pre-push tests, docs, and notebooks.
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit

      - name: Run type checking
        if: needs.changes.outputs.full == 'true'
        run: uv run pyright

  unit:
    name: Fast unit tests
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run unit tests and doctests before integration finishes
        run: |
          mkdir -p test-results
          uv run pytest -n 4 --dist worksteal \
            -m "not slow and not integration and not equivalence and not acceptance and not qualification and not benchmark and not scalability and not requires_data" \
            --doctest-modules --durations=50 --junitxml=test-results/junit.xml \
            --store-durations --clean-durations --durations-path=test-results/durations.json \
            src/hebog tests

      - name: Upload test results even after a test failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: test-results
          if-no-files-found: error

  portable:
    name: Portable execution ${{ matrix.id }}
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-312
            os: ubuntu-latest
            python: "3.12"
            workers: 4
            splits: 2
            groups: '[1,2]'
            coverage: false
          - id: linux-313
            os: ubuntu-latest
            python: "3.13"
            workers: 4
            splits: 2
            groups: '[1,2]'
            coverage: false
          - id: linux-314
            os: ubuntu-latest
            python: "3.14"
            workers: 4
            splits: 2
            groups: '[1,2]'
            coverage: true
          - id: macos-314
            os: macos-14
            python: "3.14"
            workers: 2
            splits: 2
            groups: '[1,2]'
            coverage: false
          - id: windows-314
            os: windows-latest
            python: "3.14"
            workers: 4
            splits: 4
            groups: '[1,2,3,4]'
            coverage: false
    uses: ./.github/workflows/portable-tests.yaml
    with:
      id: ${{ matrix.id }}
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      workers: ${{ matrix.workers }}
      splits: ${{ matrix.splits }}
      groups: ${{ matrix.groups }}
      coverage: ${{ matrix.coverage }}

  lowest-shards:
    name: Lowest dependency execution
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/portable-tests.yaml
    with:
      id: lowest-312
      os: ubuntu-latest
      python: "3.12"
      workers: 4
      splits: 2
      groups: '[1,2]'
      lowest: true

  test:
    name: Portable tests ${{ matrix.os }} / py${{ matrix.python }}
    # Preserve the required check name and reject unexpected skipped checks.
    needs: [changes, portable, unit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-14
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prerequisite results
        env:
          FULL_CI: ${{ needs.changes.outputs.full }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required changes --conditional portable unit

  lowest-dependencies:
    name: Portable tests ubuntu-latest / py3.12 / lowest dependencies
    # Preserve the required check name and reject unexpected skipped checks.
    needs: [changes, lowest-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prerequisite results
        env:
          FULL_CI: ${{ needs.changes.outputs.full }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required changes --conditional lowest-shards

  coverage:
    name: Portable tests ubuntu-latest / py3.14
    # Preserve the required check name and reject unexpected skipped checks.
    needs: [changes, portable]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prerequisite results
        env:
          FULL_CI: ${{ needs.changes.outputs.full }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required changes --conditional portable

      - name: Install uv and set python version
        if: needs.changes.outputs.full == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        if: needs.changes.outputs.full == 'true'
        run: uv sync --frozen --all-groups

      - name: Download every coverage shard
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Combine branch coverage and enforce the project floor
        if: needs.changes.outputs.full == 'true'
        run: |
          uv run coverage combine coverage-data
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage reports to Codecov
        if: needs.changes.outputs.full == 'true'
        uses: codecov/codecov-action@v7

  scientific-validation:
    name: Small scientific and acceptance suites
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run redistributable scientific and acceptance tests
        run: >-
          uv run pytest -q --durations=50 --junitxml=test-results/junit.xml
          -m "(equivalence or acceptance) and not qualification and not scalability and not slow and not requires_data"

      - name: Upload test results even after a test failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-scientific-validation
          path: test-results
          if-no-files-found: error

  quick-benchmark-smoke:
    name: Quick benchmark smoke
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Hosted-runner timings are not evidence; this checks the timing and
      # traced-peak measurement paths end to end on the smoke case.
      - name: Run the measurement smoke tier
        run: uv run pytest -q --durations=50 --junitxml=test-results/junit.xml -m "benchmark and not scalability" tests/benchmark

      - name: Upload test results even after a test failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-quick-benchmark-smoke
          path: test-results
          if-no-files-found: error

  notebooks:
    name: Validate Marimo notebooks
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Validate Marimo notebooks
        run: uv run marimo check --strict notebooks/*.py

      - name: Execute offline notebook demonstrations
        run: uv run python scripts/check_notebooks.py

  docs:
    name: Build docs (mkdocs)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Build HTML (fail on warnings)
        run: uv run mkdocs build --strict

      - name: Upload built docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: site

  container-build:
    name: Build container images (execution)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The development container builds the dev target.
      - name: Build the development image
        run: docker build --target dev --tag hebog-dev .

      - name: Build and start the runtime image
        run: |
          docker build --target runtime --tag hebog-runtime .
          docker run --rm hebog-runtime

  container:
    name: Build container images
    # Preserve the required check name and reject unexpected skipped checks.
    needs: [changes, container-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prerequisite results
        env:
          FULL_CI: ${{ needs.changes.outputs.full }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required changes --conditional container-build

  package-build:
    name: Build and exercise the installed wheel
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Build, install, and import package
        run: uv run --no-sync python scripts/package_smoke_test.py

  timings:
    name: Refresh test timing hints
    needs: [changes, portable, lowest-shards, unit]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download measured test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results

      - name: Merge measured shard durations
        run: >-
          python scripts/ci.py durations --input test-results
          --output test-results/durations.json

      # Only main publishes cache hints reusable by other PRs. Each run's
      # shards have already consumed their own immutable baseline artifact.
      - name: Save the main timing baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: test-results/durations.json
          key: ci-test-durations-v1-${{ github.sha }}

      - name: Upload merged timing hints
        uses: actions/upload-artifact@v7
        with:
          name: ci-measured-durations
          path: test-results/durations.json
          if-no-files-found: error

  package:
    name: Package smoke test
    # Preserve the required check name and reject unexpected skipped checks.
    needs: [changes, pre-commit, docs, test, lowest-dependencies, coverage, scientific-validation, quick-benchmark-smoke, notebooks, container, package-build, timings]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prerequisite results
        env:
          FULL_CI: ${{ needs.changes.outputs.full }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci.py gate
          --required changes pre-commit docs test lowest-dependencies coverage container
          --conditional scientific-validation quick-benchmark-smoke notebooks package-build timings
