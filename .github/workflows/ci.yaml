name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Set uv version
  UV_VERSION: "0.9.4"
  # Match the controlled replay budget before NumPy/BLAS or workers import.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"

jobs:
  pre-commit:
    name: Pre-commit hooks (lint/format/spell/type, all files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # The dedicated jobs below cover pre-push tests, docs, and notebooks.
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit

      - name: Run type checking
        run: uv run pyright

  test:
    name: Portable tests ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The coverage job supplies Ubuntu/Python 3.14. Together these jobs
        # exercise every supported operating system and Python version.
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-14
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run portable tests
        run: >-
          uv run pytest
          -n 2 --dist worksteal
          -m "not slow and not equivalence and not acceptance and not qualification and not benchmark and not scalability and not requires_data"

  coverage:
    # Preserve the existing check name for branch-protection compatibility.
    name: Portable tests ubuntu-latest / py3.14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run complete portable suite with coverage
        run: >-
          uv run pytest
          -n 2 --dist worksteal
          -m "not slow and not equivalence and not acceptance and not qualification and not benchmark and not scalability and not requires_data"
          --doctest-modules --doctest-glob="*.py"
          --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7

  scientific-validation:
    name: Small scientific and acceptance suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run redistributable scientific and acceptance tests
        run: >-
          uv run pytest -q
          -m "(equivalence or acceptance) and not qualification and not scalability and not slow and not requires_data"

  notebooks:
    name: Validate Marimo notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate Marimo notebooks
        run: uv run marimo check --strict notebooks/*.py

      - name: Execute offline notebook demonstrations
        run: uv run python scripts/check_notebooks.py

  docs:
    name: Build docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build HTML (fail on warnings)
        run: uv run mkdocs build --strict

      - name: Upload built docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: site

  package:
    name: Package smoke test
    # Branch protection uses this check as the release gate.
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build, install, and import package
        run: uv run --no-sync python scripts/package_smoke_test.py
