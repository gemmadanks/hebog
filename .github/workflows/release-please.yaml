on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  # A later push must not interrupt an upload already in progress.
  cancel-in-progress: false

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  validate-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      revision: ${{ needs.release-please.outputs.sha }}

  build-release:
    needs: [release-please, validate-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.4"

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Check the installed release and public workflow
        run: |
          uv venv "$RUNNER_TEMP/release-venv" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -I -c \
            'import os; from importlib.metadata import version; actual = version("hebog"); expected = os.environ["RELEASE_VERSION"]; assert actual == expected, (actual, expected)'
          "$RUNNER_TEMP/release-venv/bin/python" -I scripts/public_api_package_smoke.py

      - name: Retain the tested distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hebog/
    permissions:
      id-token: write
    steps:
      - name: Download the tested distributions
        uses: actions/download-artifact@v7
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
