site_name: Hebog Documentation
site_description: A scalable, Dask-aware source finder for radio-continuum images
site_url: https://gemmadanks.github.io/hebog/
repo_url: https://github.com/gemmadanks/hebog
repo_name: gemmadanks/hebog

theme:
  name: "material"
  palette:
  # Palette toggle for light mode
    - scheme: default
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: simple/falcon

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer

plugins:
  - mkdocstrings:
      default_handler: python
      locale: en
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true      # shows module name as heading
            show_root_full_path: true    # gives full module path
  - search
  - tags

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gemmadanks/hebog

nav:
  - Home: index.md
  - User guide:
      - Install Hebog: tutorials/index.md
      - "Tutorial: find sources in a FITS image": tutorials/find-sources.md
      - How-to guides:
          - Choose thresholds, a profile and an executor: how-to/configure-a-run.md
          - Use the notebooks and compare finders: how-to/notebooks.md
      - Explanation:
          - How Hebog finds sources: explanation/how-hebog-works.md
          - Hebog and other source finders: explanation/source-finder-comparison.md
      - Reference:
          - Capability and status: reference/release-status.md
          - Outputs: reference/public-products.md
          - Python API: reference/index.md
          - Glossary: reference/domain-glossary.md
  - Developer guide:
      - Integrate Hebog into a pipeline: how-to/integrate-into-a-pipeline.md
      - Architecture:
          - Overview: architecture/index.md
          - How Hebog distributes work: architecture/distributed-execution.md
          - Domain model: explanation/domain-model.md
          - Quality attributes: explanation/quality-attributes.md
          - Native-code assessment: explanation/native-code-assessment.md
          - Decision records (ADRs): architecture/adr/index.md
      - Contributing:
          - Contribute to Hebog: how-to/index.md
          - Publish releases: how-to/publish-releases.md
      - Reference:
          - Internal API: reference/internal-api.md
          - Internal schemas: reference/internal-schemas.md
          - Rapthor source-finding contract: reference/rapthor-source-finding-contract.md
          - Performance and scalability contracts: reference/performance-scalability-contracts.md
          - Where Hebog spends its time: reference/performance-profile.md
          - Validation dataset manifests: reference/dataset-manifests.md
          - Scientific comparison reports: reference/scientific-comparison.md
          - Evidence documents: reference/evidence-documents.md
          - Algorithm contracts:
              - Compact deblending: reference/compact-deblending.md
              - Compact moment measurement: reference/compact-measurement.md
              - Compact Gaussian fitting: reference/compact-fitting.md
              - Compact astrometry and beam deconvolution: reference/compact-astrometry.md
              - Compact catalogue and Rapthor FITS view: reference/compact-catalogue.md
              - Extended-emission measurement: reference/extended-emission-measurement.md
  - Tags: tags.md

extra_javascript:
    - javascript/readthedocs.js
