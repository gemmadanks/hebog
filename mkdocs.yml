site_name: Hebog Documentation
site_description: Dask-aware radio-continuum source finding for SKA SDP pipelines
site_url: https://gemmadanks.github.io/hebog/
repo_url: https://github.com/gemmadanks/hebog
repo_name: gemmadanks/hebog

theme:
  name: "material"
  palette:
  # Palette toggle for light mode
    - scheme: default
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: simple/falcon

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer

plugins:
  - mkdocstrings:
      default_handler: python
      locale: en
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true      # shows module name as heading
            show_root_full_path: true    # gives full module path
  - search
  - tags

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gemmadanks/hebog

nav:
  - Home: index.md
  - Quick start: tutorials/index.md
  - Find sources: tutorials/find-sources.md
  - Development:
      - Development history: explanation/development-history.md
      - Workflows: how-to/index.md
      - Publish releases to PyPI: how-to/publish-releases.md
      - Notebooks and comparison refreshes: how-to/notebooks.md
  - Reference:
      - Current capability and releases: reference/release-status.md
      - Current scientific campaign: reference/phase-5-campaign-overview.md
      - Scientific readiness: reference/phase-5-release-readiness.md
      - API: reference/index.md
      - Public source-finder outputs: reference/public-products.md
      - Domain glossary: reference/domain-glossary.md
      - Internal catalogue and result schemas: reference/internal-schemas.md
      - Rapthor source-finding contract: reference/rapthor-source-finding-contract.md
      - Validation dataset manifests: reference/dataset-manifests.md
      - Scientific comparison reports: reference/scientific-comparison.md
      - Evidence documents: reference/evidence-documents.md
      - Performance and scalability contracts: reference/performance-scalability-contracts.md
      - Compact deblending: reference/compact-deblending.md
      - Extended-emission measurement: reference/extended-emission-measurement.md
      - Compact moment measurement: reference/compact-measurement.md
      - Compact Gaussian fitting: reference/compact-fitting.md
      - Compact astrometry and beam deconvolution: reference/compact-astrometry.md
      - Compact catalogue and Rapthor FITS view: reference/compact-catalogue.md
      - Dated scientific evidence and contracts:
          - Scientific pre-review findings: reference/scientific-pre-review.md
          - Phase 0 starting revisions: reference/starting-revisions.md
          - Phase 0 baseline results: reference/phase-0-baseline-results.md
  - Explanation:
      - Architecture: explanation/index.md
      - How Hebog finds sources: explanation/how-hebog-works.md
      - Domain model: explanation/domain-model.md
      - Quality attributes: explanation/quality-attributes.md
      - Native-code assessment: explanation/native-code-assessment.md
  - Architecture:
      - Overview: architecture/index.md
      - ADRs: architecture/adr/index.md
  - Tags: tags.md

extra_javascript:
    - javascript/readthedocs.js
