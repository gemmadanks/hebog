site_name: Hebog Documentation
site_description: Dask-aware radio-continuum source finding for SKA SDP pipelines
site_url: https://gemmadanks.github.io/hebog/
repo_url: https://github.com/gemmadanks/hebog
repo_name: gemmadanks/hebog

theme:
  name: "material"
  palette:
  # Palette toggle for light mode
    - scheme: default
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: simple/falcon

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer

plugins:
  - mkdocstrings:
      default_handler: python
      locale: en
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true      # shows module name as heading
            show_root_full_path: true    # gives full module path
  - search
  - tags

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gemmadanks/hebog

nav:
  - Home: index.md
  - Quick start: tutorials/index.md
  - Development: how-to/index.md
  - Reference:
      - API: reference/index.md
      - Domain glossary: reference/domain-glossary.md
      - Internal catalogue and result schemas: reference/internal-schemas.md
      - Rapthor source-finding contract: reference/rapthor-source-finding-contract.md
      - Scientific pre-review findings: reference/scientific-pre-review.md
      - Phase 0 starting revisions: reference/starting-revisions.md
      - Phase 0 baseline results: reference/phase-0-baseline-results.md
      - Validation dataset manifests: reference/dataset-manifests.md
      - Scientific comparison reports: reference/scientific-comparison.md
      - Evidence documents: reference/evidence-documents.md
      - Performance and scalability contracts: reference/performance-scalability-contracts.md
      - Phase 0 review record: reference/phase-0-review-record.md
      - Phase 1 release readiness: reference/phase-1-release-readiness.md
      - Phase 2 release readiness: reference/phase-2-release-readiness.md
      - Phase 3 release readiness: reference/phase-3-release-readiness.md
      - Phase 3 scientific review record: reference/phase-3-review-record.md
      - Phase 4 scientific review record: reference/phase-4-review-record.md
      - Phase 4 paired non-inferiority: reference/phase-4-paired-noninferiority.md
      - Phase 4S compact qualification: reference/phase-4s-qualification-protocol.md
      - Phase 4T compact confirmation: reference/phase-4t-confirmation-protocol.md
      - Phase 4U compact-blend qualification: reference/phase-4u-qualification-protocol.md
      - Phase 4 release readiness: reference/phase-4-release-readiness.md
      - Phase 5 multiscale contract and development review: reference/phase-5-contract.md
      - Phase 5 scale-filter selection: reference/phase-5-filter-selection.md
      - Phase 5 astrometry technical pre-review: reference/phase-5-astrometry-pre-review.md
      - Phase 5 extended-position follow-up review: reference/phase-5-astrometry-follow-up-review.md
      - Compact deblending: reference/compact-deblending.md
      - Compact moment measurement: reference/compact-measurement.md
      - Compact Gaussian fitting: reference/compact-fitting.md
      - Compact astrometry and beam deconvolution: reference/compact-astrometry.md
      - Compact catalogue and Rapthor FITS view: reference/compact-catalogue.md
  - Explanation:
